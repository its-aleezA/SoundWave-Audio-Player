<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Player</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            color: #fff;
            height: 100vh;
            overflow: hidden;
        }

        .app-container {
            display: grid;
            grid-template-columns: 250px 1fr;
            grid-template-rows: 1fr 90px;
            height: 100vh;
            gap: 0;
        }

        .sidebar {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            padding: 20px;
            overflow-y: auto;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-item {
            padding: 12px 16px;
            margin-bottom: 8px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-item:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateX(5px);
        }

        .nav-item.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .playlists-section {
            margin-top: 30px;
        }

        .section-title {
            font-size: 14px;
            font-weight: 600;
            opacity: 0.6;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .playlist-item {
            padding: 10px 16px;
            margin-bottom: 4px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 14px;
        }

        .playlist-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .main-content {
            padding: 30px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.2);
        }

        .header {
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 48px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .btn {
            padding: 12px 32px;
            border-radius: 50px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
            margin-right: 10px;
            margin-top: 20px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.5);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            backdrop-filter: blur(10px);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .song-list {
            margin-top: 30px;
        }

        .song-item {
            display: grid;
            grid-template-columns: 50px 1fr 100px 80px;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 4px;
            transition: all 0.2s ease;
            cursor: pointer;
            align-items: center;
            gap: 16px;
        }

        .song-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .song-item.playing {
            background: rgba(102, 126, 234, 0.2);
        }

        .song-number {
            text-align: center;
            opacity: 0.6;
        }

        .song-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .song-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .song-details {
            flex: 1;
        }

        .song-title {
            font-weight: 500;
            margin-bottom: 4px;
        }

        .song-artist {
            font-size: 13px;
            opacity: 0.6;
        }

        .song-duration {
            opacity: 0.6;
            font-size: 14px;
        }

        .song-actions {
            display: flex;
            gap: 8px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .song-item:hover .song-actions {
            opacity: 1;
        }

        .action-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.1);
        }

        .player-bar {
            grid-column: 1 / -1;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding: 16px 24px;
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            align-items: center;
            gap: 24px;
        }

        .now-playing {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .now-playing-art {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .now-playing-info h4 {
            font-size: 14px;
            margin-bottom: 4px;
        }

        .now-playing-info p {
            font-size: 12px;
            opacity: 0.6;
        }

        .player-controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .control-buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
        }

        .control-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            font-size: 16px;
        }

        .control-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
        }

        .control-btn.play-btn {
            width: 48px;
            height: 48px;
            background: white;
            color: #0f0c29;
            font-size: 20px;
        }

        .control-btn.play-btn:hover {
            transform: scale(1.1);
        }

        .progress-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .time {
            font-size: 12px;
            opacity: 0.6;
            min-width: 40px;
        }

        .progress-bar {
            flex: 1;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            cursor: pointer;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            border-radius: 3px;
            transition: width 0.1s linear;
            position: relative;
            width: 0%;
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            right: -6px;
            top: 50%;
            transform: translateY(-50%);
            width: 12px;
            height: 12px;
            background: white;
            border-radius: 50%;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .progress-bar:hover .progress-fill::after {
            opacity: 1;
        }

        .volume-control {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 12px;
        }

        .volume-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: transparent;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .volume-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .volume-slider {
            width: 100px;
            height: 4px;
            -webkit-appearance: none;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            outline: none;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            background: white;
            border-radius: 50%;
            cursor: pointer;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: rgba(30, 30, 60, 0.95);
            border-radius: 16px;
            padding: 32px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
        }

        .modal-header {
            margin-bottom: 24px;
        }

        .modal-header h2 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .close-btn {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            cursor: pointer;
            font-size: 20px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(0, 0, 0, 0.3);
            color: white;
            font-size: 14px;
        }

        .song-select-list {
            max-height: 300px;
            overflow-y: auto;
            margin-top: 20px;
        }

        .select-song-item {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .select-song-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .select-song-item.selected {
            background: rgba(102, 126, 234, 0.3);
        }

        .checkbox {
            width: 20px;
            height: 20px;
            border-radius: 4px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .checkbox.checked {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-color: transparent;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            opacity: 0.6;
        }

        .empty-state h3 {
            font-size: 24px;
            margin-bottom: 12px;
        }

        .empty-state p {
            font-size: 14px;
        }

        .history-panel {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 20px;
            margin-top: 30px;
        }

        .history-item {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            background: rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .history-number {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .app-container {
                grid-template-columns: 1fr;
            }

            .sidebar {
                display: none;
            }

            .player-bar {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .volume-control {
                display: none;
            }
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="logo">🎵 AudioPlayer</div>
            <nav>
                <div class="nav-item active" onclick="app.showLibrary()">
                    <span>📚</span> Library
                </div>
                <div class="nav-item" onclick="app.showHistory()">
                    <span>🕐</span> History
                </div>
            </nav>
            <div class="playlists-section">
                <div class="section-title">Playlists</div>
                <div id="playlistsSidebar"></div>
            </div>
        </aside>

        <main class="main-content" id="mainContent">
            <div class="header">
                <h1>Your Library</h1>
                <button class="btn btn-primary" onclick="app.selectDirectory()">📁 Select Audio Files</button>
                <button class="btn btn-secondary" onclick="app.openCreatePlaylistModal()">➕ Create Playlist</button>
            </div>
            <div id="contentArea">
                <div class="empty-state">
                    <h3>No songs loaded</h3>
                    <p>Click "Select Audio Files" to get started</p>
                </div>
            </div>
        </main>

        <div class="player-bar">
            <div class="now-playing">
                <div class="now-playing-art">🎵</div>
                <div class="now-playing-info">
                    <h4 id="currentTrackName">No track playing</h4>
                    <p id="currentTrackArtist">-</p>
                </div>
            </div>

            <div class="player-controls">
                <div class="control-buttons">
                    <button class="control-btn" onclick="app.previousTrack()">⏮</button>
                    <button class="control-btn play-btn" onclick="app.togglePlay()" id="playBtn">▶</button>
                    <button class="control-btn" onclick="app.nextTrack()">⏭</button>
                    <button class="control-btn" onclick="app.toggleShuffle()" id="shuffleBtn">🔀</button>
                    <button class="control-btn" onclick="app.toggleRepeat()" id="repeatBtn">🔁</button>
                </div>
                <div class="progress-container">
                    <span class="time" id="currentTime">0:00</span>
                    <div class="progress-bar" onclick="app.seek(event)">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <span class="time" id="totalTime">0:00</span>
                </div>
            </div>

            <div class="volume-control">
                <button class="volume-btn" onclick="app.toggleMute()">🔊</button>
                <input type="range" class="volume-slider" min="0" max="100" value="70" oninput="app.setVolume(this.value)">
            </div>
        </div>
    </div>

    <div class="modal" id="createPlaylistModal">
        <div class="modal-content">
            <button class="close-btn" onclick="app.closeModal()">✕</button>
            <div class="modal-header">
                <h2>Create Playlist</h2>
            </div>
            <div class="input-group">
                <label>Playlist Name</label>
                <input type="text" id="playlistNameInput" placeholder="My Awesome Playlist">
            </div>
            <div class="input-group">
                <label>Select Songs</label>
                <div class="song-select-list" id="songSelectList"></div>
            </div>
            <button class="btn btn-primary" onclick="app.createPlaylist()">Create Playlist</button>
        </div>
    </div>

    <script>
        // C++ Data Structures Implementation
        class Node {
            constructor(data) {
                this.data = data;
                this.nextNode = null;
                this.previousNode = null;
            }
        }

        class DoublyLinkedList {
            constructor() {
                this.head = null;
                this.tail = null;
                this.length = 0;
            }

            insertAtEnd(val) {
                const newNode = new Node(val);
                if (this.isEmpty()) {
                    this.head = this.tail = newNode;
                } else {
                    this.tail.nextNode = newNode;
                    newNode.previousNode = this.tail;
                    this.tail = newNode;
                }
                this.length++;
            }

            deleteFromPosition(n) {
                if (n < 1 || n > this.length) return;
                
                if (n === 1) {
                    const temp = this.head;
                    this.head = this.head.nextNode;
                    if (this.head) this.head.previousNode = null;
                    else this.tail = null;
                    this.length--;
                    return;
                }
                
                if (n === this.length) {
                    const temp = this.tail;
                    this.tail = this.tail.previousNode;
                    if (this.tail) this.tail.nextNode = null;
                    else this.head = null;
                    this.length--;
                    return;
                }
                
                let temp = this.head;
                for (let i = 1; i < n; i++) {
                    temp = temp.nextNode;
                }
                temp.previousNode.nextNode = temp.nextNode;
                temp.nextNode.previousNode = temp.previousNode;
                this.length--;
            }

            toArray() {
                const arr = [];
                let temp = this.head;
                while (temp) {
                    arr.push(temp.data);
                    temp = temp.nextNode;
                }
                return arr;
            }

            shuffle() {
                const arr = this.toArray();
                for (let i = arr.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [arr[i], arr[j]] = [arr[j], arr[i]];
                }
                return arr;
            }

            isEmpty() {
                return this.head === null;
            }

            getLength() {
                return this.length;
            }
        }

        class StaticQueue {
            constructor(capacity = 5) {
                this.capacity = capacity;
                this.arr = [];
                this.front = 0;
                this.rear = -1;
                this.length = 0;
            }

            enqueue(data) {
                if (this.isFull()) {
                    this.dequeue();
                }
                this.rear = (this.rear + 1) % this.capacity;
                this.arr[this.rear] = data;
                if (this.length < this.capacity) this.length++;
            }

            dequeue() {
                if (this.isEmpty()) return;
                this.front = (this.front + 1) % this.capacity;
                this.length--;
            }

            isEmpty() {
                return this.length === 0;
            }

            isFull() {
                return this.length === this.capacity;
            }

            display() {
                const result = [];
                for (let i = 0; i < this.length; i++) {
                    result.push(this.arr[(this.front + i) % this.capacity]);
                }
                return result;
            }
        }

        class Track {
            constructor(name, file) {
                this.name = name;
                this.artist = "Unknown Artist";
                this.duration = 0;
                this.file = file;
            }

            getName() {
                return this.name;
            }
        }

        class Playlist {
            constructor(name) {
                this.name = name;
                this.songs = new DoublyLinkedList();
                this.history = new StaticQueue(5);
            }

            insertAtTail(track) {
                this.songs.insertAtEnd(track);
                this.history.enqueue(track.getName());
            }

            deleteAtPosition(p) {
                this.songs.deleteFromPosition(p);
            }

            traverse() {
                return this.songs.toArray();
            }

            shuffle() {
                return this.songs.shuffle();
            }

            isEmpty() {
                return this.songs.isEmpty();
            }

            getName() {
                return this.name;
            }

            displayHistory() {
                return this.history.display();
            }
        }

        // Main Application
        class AudioPlayer {
            constructor() {
                this.songs = [];
                this.allPlaylists = [];
                this.currentPlaylist = null;
                this.currentTrackIndex = 0;
                this.isPlaying = false;
                this.isShuffleOn = false;
                this.isRepeatOn = false;
                this.shuffledOrder = [];
                this.selectedSongs = new Set();
                this.audio = null;
                this.audioInitialized = false;
                
                // Initialize audio on first user interaction
                this.initAudio();
            }

            initAudio() {
                // Create audio element in DOM
                this.audio = document.createElement('audio');
                this.audio.id = 'mainAudio';
                this.audio.preload = 'auto';
                this.audio.volume = 0.7;
                document.body.appendChild(this.audio);
                
                this.setupAudioEvents();
            }

            setupAudioEvents() {
                this.audio.addEventListener('timeupdate', () => {
                    const current = this.audio.currentTime;
                    const duration = this.audio.duration;
                    
                    document.getElementById('currentTime').textContent = this.formatTime(current);
                    document.getElementById('totalTime').textContent = this.formatTime(duration);
                    
                    const percent = (current / duration) * 100 || 0;
                    document.getElementById('progressFill').style.width = percent + '%';
                });

                this.audio.addEventListener('ended', () => {
                    this.nextTrack();
                });

                this.audio.addEventListener('loadedmetadata', () => {
                    document.getElementById('totalTime').textContent = this.formatTime(this.audio.duration);
                });

                this.audio.addEventListener('canplaythrough', () => {
                    console.log('✓ Audio ready to play');
                });

                this.audio.addEventListener('error', (e) => {
                    console.error('Audio element error:', e);
                    if (this.audio.error) {
                        console.error('Error code:', this.audio.error.code);
                        console.error('Error message:', this.audio.error.message);
                    }
                });
            }

            selectDirectory() {
                const input = document.createElement('input');
                input.type = 'file';
                input.multiple = true;
                input.accept = 'audio/*';
                
                input.onchange = (e) => {
                    const files = Array.from(e.target.files);
                    this.songs = [];
                    
                    files.forEach(file => {
                        const ext = file.name.split('.').pop().toLowerCase();
                        if (['mp3', 'wav', 'ogg', 'flac', 'm4a', 'aac'].includes(ext)) {
                            const track = new Track(file.name, file);
                            this.songs.push(track);
                        }
                    });
                    
                    if (this.songs.length > 0) {
                        this.displaySongs();
                    } else {
                        alert('No audio files found!');
                    }
                };
                
                input.click();
            }

            displaySongs() {
                const contentArea = document.getElementById('contentArea');
                if (this.songs.length === 0) {
                    contentArea.innerHTML = `
                        <div class="empty-state">
                            <h3>No songs found</h3>
                            <p>Try selecting different files</p>
                        </div>
                    `;
                    return;
                }

                let html = '<div class="song-list">';
                this.songs.forEach((song, index) => {
                    html += `
                        <div class="song-item" onclick="app.playSongFromLibrary(${index})">
                            <div class="song-number">${index + 1}</div>
                            <div class="song-info">
                                <div class="song-icon">🎵</div>
                                <div class="song-details">
                                    <div class="song-title">${song.name}</div>
                                    <div class="song-artist">${song.artist}</div>
                                </div>
                            </div>
                            <div class="song-duration">-:--</div>
                            <div class="song-actions">
                                <button class="action-btn">⋯</button>
                            </div>
                        </div>
                    `;
                });
                html += '</div>';
                contentArea.innerHTML = html;
            }

            openCreatePlaylistModal() {
                if (this.songs.length === 0) {
                    alert('Please select audio files first!');
                    return;
                }

                const modal = document.getElementById('createPlaylistModal');
                const songList = document.getElementById('songSelectList');
                
                this.selectedSongs.clear();
                let html = '';
                this.songs.forEach((song, index) => {
                    html += `
                        <div class="select-song-item" onclick="app.toggleSongSelection(${index})">
                            <div class="checkbox" id="checkbox-${index}"></div>
                            <div class="song-details">
                                <div class="song-title">${song.name}</div>
                            </div>
                        </div>
                    `;
                });
                songList.innerHTML = html;
                modal.classList.add('show');
            }

            closeModal() {
                document.getElementById('createPlaylistModal').classList.remove('show');
                document.getElementById('playlistNameInput').value = '';
            }

            toggleSongSelection(index) {
                const checkbox = document.getElementById(`checkbox-${index}`);
                if (this.selectedSongs.has(index)) {
                    this.selectedSongs.delete(index);
                    checkbox.classList.remove('checked');
                    checkbox.innerHTML = '';
                } else {
                    this.selectedSongs.add(index);
                    checkbox.classList.add('checked');
                    checkbox.innerHTML = '✓';
                }
            }

            createPlaylist() {
                const name = document.getElementById('playlistNameInput').value.trim();
                if (!name) {
                    alert('Please enter a playlist name');
                    return;
                }

                if (this.selectedSongs.size === 0) {
                    alert('Please select at least one song');
                    return;
                }

                const newPlaylist = new Playlist(name);
                this.selectedSongs.forEach(index => {
                    newPlaylist.insertAtTail(this.songs[index]);
                });

                this.allPlaylists.push(newPlaylist);
                this.updatePlaylistsSidebar();
                this.closeModal();
                
                alert(`Playlist "${name}" created with ${newPlaylist.songs.getLength()} songs!`);
            }

            updatePlaylistsSidebar() {
                const sidebar = document.getElementById('playlistsSidebar');
                let html = '';
                this.allPlaylists.forEach((playlist, index) => {
                    html += `
                        <div class="playlist-item" onclick="app.viewPlaylist(${index})">
                            ${playlist.getName()} (${playlist.songs.getLength()})
                        </div>
                    `;
                });
                sidebar.innerHTML = html;
            }

            viewPlaylist(index) {
                this.currentPlaylist = this.allPlaylists[index];
                const contentArea = document.getElementById('contentArea');
                const songs = this.currentPlaylist.traverse();
                
                let html = `
                    <div class="header">
                        <h1>${this.currentPlaylist.getName()}</h1>
                        <button class="btn btn-primary" onclick="app.playPlaylist(${index})">▶ Play All</button>
                        <button class="btn btn-secondary" onclick="app.playPlaylistShuffled(${index})">🔀 Shuffle Play</button>
                    </div>
                    <div class="song-list">
                `;
                
                songs.forEach((song, idx) => {
                    html += `
                        <div class="song-item" onclick="app.playFromPlaylist(${index}, ${idx})">
                            <div class="song-number">${idx + 1}</div>
                            <div class="song-info">
                                <div class="song-icon">🎵</div>
                                <div class="song-details">
                                    <div class="song-title">${song.name}</div>
                                    <div class="song-artist">${song.artist}</div>
                                </div>
                            </div>
                            <div class="song-duration">-:--</div>
                            <div class="song-actions">
                                <button class="action-btn" onclick="event.stopPropagation(); app.removeFromPlaylist(${index}, ${idx + 1});">🗑</button>
                            </div>
                        </div>
                    `;
                });
                
                html += '</div>';
                
                const history = this.currentPlaylist.displayHistory();
                if (history.length > 0) {
                    html += `
                        <div class="history-panel">
                            <div class="section-title">Recently Played</div>
                    `;
                    history.forEach((track, idx) => {
                        html += `
                            <div class="history-item">
                                <div class="history-number">${idx + 1}</div>
                                <div class="song-title">${track}</div>
                            </div>
                        `;
                    });
                    html += '</div>';
                }
                
                contentArea.innerHTML = html;
            }

            removeFromPlaylist(playlistIndex, songPosition) {
                this.allPlaylists[playlistIndex].deleteAtPosition(songPosition);
                this.viewPlaylist(playlistIndex);
            }

            playPlaylist(index) {
                this.currentPlaylist = this.allPlaylists[index];
                this.currentTrackIndex = 0;
                this.isShuffleOn = false;
                this.shuffledOrder = [];
                this.playCurrentTrack();
            }

            playPlaylistShuffled(index) {
                this.currentPlaylist = this.allPlaylists[index];
                this.isShuffleOn = true;
                this.shuffledOrder = this.currentPlaylist.shuffle();
                this.currentTrackIndex = 0;
                this.playCurrentTrack();
            }

            playFromPlaylist(playlistIndex, songIndex) {
                this.currentPlaylist = this.allPlaylists[playlistIndex];
                this.currentTrackIndex = songIndex;
                this.isShuffleOn = false;
                this.shuffledOrder = [];
                this.playCurrentTrack();
            }

            playSongFromLibrary(index) {
                this.currentPlaylist = new Playlist('Library');
                this.songs.forEach(song => this.currentPlaylist.insertAtTail(song));
                this.currentTrackIndex = index;
                this.isShuffleOn = false;
                this.playCurrentTrack();
            }

            playCurrentTrack() {
                if (!this.currentPlaylist) return;
                
                const songs = this.isShuffleOn ? this.shuffledOrder : this.currentPlaylist.traverse();
                if (this.currentTrackIndex < 0 || this.currentTrackIndex >= songs.length) return;
                
                const track = songs[this.currentTrackIndex];
                if (!track.file) return;
                
                document.getElementById('currentTrackName').textContent = track.name;
                document.getElementById('currentTrackArtist').textContent = this.currentPlaylist.getName();
                document.getElementById('playBtn').textContent = '⏳';
                
                // Stop and reset current audio
                this.audio.pause();
                this.audio.currentTime = 0;
                this.audio.removeAttribute('src');
                this.audio.load();
                
                // Create new blob URL
                const blob = new Blob([track.file], { type: track.file.type || 'audio/mpeg' });
                const url = URL.createObjectURL(blob);
                
                console.log('Created URL:', url);
                console.log('File info:', {
                    name: track.file.name,
                    type: track.file.type,
                    size: track.file.size
                });
                
                // Set source
                this.audio.src = url;
                
                // Load and play
                this.audio.load();
                
                // Wait a moment for load
                setTimeout(() => {
                    const playPromise = this.audio.play();
                    
                    if (playPromise !== undefined) {
                        playPromise.then(() => {
                            this.isPlaying = true;
                            document.getElementById('playBtn').textContent = '⏸';
                            console.log('✓ Successfully playing:', track.name);
                        }).catch(err => {
                            console.error('✗ Play failed:', err);
                            
                            // Try with a fresh audio element
                            this.tryFreshAudioElement(track, url);
                        });
                    }
                }, 200);
                
                document.querySelectorAll('.song-item').forEach((item, idx) => {
                    item.classList.toggle('playing', idx === this.currentTrackIndex);
                });
            }
            
            tryFreshAudioElement(track, existingUrl) {
                console.log('Trying fresh audio element approach...');
                
                // Remove old audio
                if (this.audio && this.audio.parentNode) {
                    this.audio.parentNode.removeChild(this.audio);
                }
                
                // Create completely new audio element
                this.audio = document.createElement('audio');
                this.audio.controls = true;
                this.audio.style.position = 'fixed';
                this.audio.style.bottom = '100px';
                this.audio.style.left = '50%';
                this.audio.style.transform = 'translateX(-50%)';
                this.audio.style.zIndex = '10000';
                this.audio.volume = 0.7;
                document.body.appendChild(this.audio);
                
                // Re-setup events
                this.setupAudioEvents();
                
                // Set source
                this.audio.src = existingUrl;
                this.audio.load();
                
                // User must click play on the visible controls
                alert(`Browser blocked automatic playback.\n\nPlease click the PLAY button on the audio controls that appeared at the bottom of the screen.\n\nPlaying: ${track.name}`);
                
                this.audio.addEventListener('play', () => {
                    this.isPlaying = true;
                    document.getElementById('playBtn').textContent = '⏸';
                    // Hide controls after successful play
                    setTimeout(() => {
                        if (this.audio) {
                            this.audio.controls = false;
                            this.audio.style.display = 'none';
                        }
                    }, 2000);
                }, { once: true });
            }
            
            tryDataUrlPlayback(track) {
                console.log('Trying data URL method for:', track.name);
                
                const reader = new FileReader();
                
                reader.onload = (e) => {
                    this.audio.src = e.target.result;
                    this.audio.load();
                    
                    this.audio.play().then(() => {
                        this.isPlaying = true;
                        document.getElementById('playBtn').textContent = '⏸';
                        console.log('✓ Data URL playback successful');
                    }).catch(err => {
                        console.error('✗ Data URL playback also failed:', err);
                        alert(`Cannot play "${track.name}".\n\nYour browser may not support this audio format.\n\nSupported formats:\n- MP3 (best)\n- WAV\n- OGG (some browsers)\n\nError: ${err.name}`);
                        document.getElementById('playBtn').textContent = '▶';
                    });
                };
                
                reader.readAsDataURL(track.file);
            }

            togglePlay() {
                if (!this.audio.src) {
                    if (this.currentPlaylist && !this.currentPlaylist.isEmpty()) {
                        this.playCurrentTrack();
                    } else if (this.songs.length > 0) {
                        this.playSongFromLibrary(0);
                    } else {
                        alert('No songs loaded. Please select audio files first.');
                    }
                    return;
                }
                
                if (this.isPlaying) {
                    this.audio.pause();
                    document.getElementById('playBtn').textContent = '▶';
                    this.isPlaying = false;
                } else {
                    this.audio.play().then(() => {
                        document.getElementById('playBtn').textContent = '⏸';
                        this.isPlaying = true;
                    }).catch(err => {
                        console.error('Resume failed:', err);
                        alert('Cannot resume playback.');
                    });
                }
            }

            nextTrack() {
                if (!this.currentPlaylist) return;
                
                const songs = this.isShuffleOn ? this.shuffledOrder : this.currentPlaylist.traverse();
                this.currentTrackIndex++;
                
                if (this.currentTrackIndex >= songs.length) {
                    if (this.isRepeatOn) {
                        this.currentTrackIndex = 0;
                    } else {
                        this.currentTrackIndex = songs.length - 1;
                        this.audio.pause();
                        this.isPlaying = false;
                        document.getElementById('playBtn').textContent = '▶';
                        return;
                    }
                }
                
                this.playCurrentTrack();
            }

            previousTrack() {
                if (!this.currentPlaylist) return;
                
                if (this.audio.currentTime > 3) {
                    this.audio.currentTime = 0;
                    return;
                }
                
                this.currentTrackIndex--;
                if (this.currentTrackIndex < 0) {
                    this.currentTrackIndex = 0;
                }
                
                this.playCurrentTrack();
            }

            toggleShuffle() {
                this.isShuffleOn = !this.isShuffleOn;
                const btn = document.getElementById('shuffleBtn');
                
                if (this.isShuffleOn) {
                    btn.style.background = 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)';
                    if (this.currentPlaylist) {
                        this.shuffledOrder = this.currentPlaylist.shuffle();
                    }
                } else {
                    btn.style.background = 'rgba(255, 255, 255, 0.1)';
                    this.shuffledOrder = [];
                }
            }

            toggleRepeat() {
                this.isRepeatOn = !this.isRepeatOn;
                const btn = document.getElementById('repeatBtn');
                btn.style.background = this.isRepeatOn ? 
                    'linear-gradient(135deg, #667eea 0%, #764ba2 100%)' : 
                    'rgba(255, 255, 255, 0.1)';
            }

            seek(event) {
                const bar = event.currentTarget;
                const rect = bar.getBoundingClientRect();
                const percent = (event.clientX - rect.left) / rect.width;
                this.audio.currentTime = percent * this.audio.duration;
            }

            setVolume(value) {
                this.audio.volume = value / 100;
            }

            toggleMute() {
                this.audio.muted = !this.audio.muted;
                event.currentTarget.textContent = this.audio.muted ? '🔇' : '🔊';
            }

            formatTime(seconds) {
                if (isNaN(seconds)) return '0:00';
                const mins = Math.floor(seconds / 60);
                const secs = Math.floor(seconds % 60);
                return `${mins}:${secs.toString().padStart(2, '0')}`;
            }

            showLibrary() {
                document.querySelectorAll('.nav-item').forEach(item => {
                    item.classList.remove('active');
                });
                event.currentTarget.classList.add('active');
                this.displaySongs();
            }

            showHistory() {
                document.querySelectorAll('.nav-item').forEach(item => {
                    item.classList.remove('active');
                });
                event.currentTarget.classList.add('active');
                
                const contentArea = document.getElementById('contentArea');
                let html = `
                    <div class="header">
                        <h1>Recently Played</h1>
                    </div>
                `;
                
                if (this.allPlaylists.length === 0) {
                    html += `
                        <div class="empty-state">
                            <h3>No history yet</h3>
                            <p>Start playing some songs!</p>
                        </div>
                    `;
                } else {
                    this.allPlaylists.forEach((playlist) => {
                        const history = playlist.displayHistory();
                        if (history.length > 0) {
                            html += `
                                <div class="history-panel">
                                    <div class="section-title">${playlist.getName()}</div>
                            `;
                            history.forEach((track, trackIdx) => {
                                html += `
                                    <div class="history-item">
                                        <div class="history-number">${trackIdx + 1}</div>
                                        <div class="song-title">${track}</div>
                                    </div>
                                `;
                            });
                            html += '</div>';
                        }
                    });
                }
                
                contentArea.innerHTML = html;
            }
        }

        // Initialize app
        const app = new AudioPlayer();

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT') return;
            
            switch(e.code) {
                case 'Space':
                    e.preventDefault();
                    app.togglePlay();
                    break;
                case 'ArrowRight':
                    e.preventDefault();
                    app.nextTrack();
                    break;
                case 'ArrowLeft':
                    e.preventDefault();
                    app.previousTrack();
                    break;
            }
        });
    </script>
</body>
</html>
